### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true
add_tokens_list: 'data/Sports_D_base_omoe_v2/new_tokens.json'
### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
gradient_checkpointing: true
### dataset
dataset_dir: data
dataset: Sports_D_base_omoe_v2_train
eval_dataset: Sports_D_base_omoe_v2_valid
cutoff_len: 1024
preprocessing_num_workers: 16
dataloader_num_workers: 4
### output
output_dir: runs/full_ablation_sports10/SAMGR/base_omoe_v2/generator
logging_steps: 1
save_steps: 0.05
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_strategy: steps
load_best_model_at_end: true
save_total_limit: 1
### experiment
report_to: wandb
run_name: full_ablation_sports10_samgr_base_omoe_v2
### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 64
learning_rate: 3.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 20
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
early_stopping_steps: 3
metric_for_best_model: loss
seed: 42
data_seed: 42
### eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 0.05
