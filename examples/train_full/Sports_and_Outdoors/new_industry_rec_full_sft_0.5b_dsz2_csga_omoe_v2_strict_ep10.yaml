### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true
add_tokens_list: 'data/Sports_and_Outdoors/new_tokens.json'
### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: Sports_and_Outdoors_train
cutoff_len: 512
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: newsaves/qwen2.5-0.5b/full/Sports_and_Outdoors-sft-dsz2_csga_omoe_v2_strict_ep10
logging_steps: 1
save_steps: 20
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_strategy: steps
load_best_model_at_end: true
save_total_limit: 3
### experiment
report_to: wandb
run_name: Sports-qwen2.5-0.5b-sft-dsz2-csga-omoe-v2-strict-ep10

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 16
learning_rate: 3.0e-4
num_train_epochs: 10.0
lr_scheduler_type: cosine

warmup_steps: 20
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### early stopping: monitor every 0.1 epoch; stop after 1.2 epochs without >1e-4 eval-loss gain; never before epoch 2.5
early_stopping_steps: 12
early_stopping_threshold: 0.0001
early_stopping_min_epochs: 2.5
metric_for_best_model: loss
greater_is_better: false

### eval
eval_dataset: Sports_and_Outdoors_valid
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 20
